          - active
          - dormant
          - lead
          - lost
          - prospect
          - qualified
        description: |-
          * `lead` - Lead
          * `qualified` - Qualified
          * `prospect` - Prospect
          * `active` - Active
          * `dormant` - Dormant
          * `lost` - Lost
      tags:
