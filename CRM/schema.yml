          format: uuid
      - in: query
        name: created_by
        schema:
          type: string
          format: uuid
      - in: query
        name: lead_source
        schema:
          type: string
          enum:
          - cold_call
          - facebook
          - google_ads
          - instagram
          - linkedin
          - organic_search
          - referral
          - website
        description: |-
          * `instagram` - Instagram
          * `facebook` - Facebook
          * `google_ads` - Google Ads
          * `linkedin` - LinkedIn
          * `referral` - Referral
          * `website` - Website
          * `cold_call` - Cold Call
          * `organic_search` - Organic Search
